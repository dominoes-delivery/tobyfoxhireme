<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
// =====================================================
// CONFIGURATION
// Change only these values
// =====================================================

const GAME_NAME = "Toby Fox Hire Me";

const TAGLINE =
    "Get the game now so you can experience game.";

const DESCRIPTION =
    "This game has flying eggs and this game has a big monster goblin and this game is really hard. If you dont win then you are die.";

const GITHUB_URL =
    "https://github.com/dominoes-delivery/tobyfoxhireme";

const ITCH_URL =
    "https://applemonkey5.itch.io/undertale-but-temu";

const HERO_IMAGE =
    "./broken_heart.png";

const FEATURES = [
    "Built with Unity",
    "Code available on Github",
    "Inspired by Undertale",
    "Playable on itch.io"
];

const AUTHOR = "AppleMonkey5";

// =====================================================
</script>

<title id="page-title">Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #121212;
    color: white;
    line-height: 1.6;
}

.hero {
    text-align: center;
    padding: 80px 20px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

.hero h1 {
    font-size: 3rem;
    margin-bottom: 15px;
}

.hero p {
    max-width: 800px;
    margin: auto;
    opacity: 0.9;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 40px 20px;
}

.hero-image {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 40px;
}

.buttons {
    margin-top: 30px;
}

.btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    padding: 14px 28px;
    margin: 10px;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-2px);
}

.github {
    background: #24292e;
}

.itch {
    background: #fa5c5c;
}

.section-title {
    margin-bottom: 20px;
}

.features {
    list-style: none;
    margin-top: 20px;
}

.features li {
    margin: 12px 0;
}

footer {
    text-align: center;
    margin-top: 60px;
    padding: 30px;
    opacity: 0.7;
}
</style>
</head>

<body>

<section class="hero">
    <h1 id="game-name"></h1>
    <p id="tagline"></p>

    <div class="buttons">
        <a id="github-link" class="btn github" target="_blank">
            View Source Code
        </a>

        <a id="itch-link" class="btn itch" target="_blank">
            Play on itch.io
        </a>
    </div>
</section>

<div class="container">

    <img
        id="hero-image"
        class="hero-image"
        alt="Game Screenshot">

    <h2 class="section-title">About</h2>

    <p id="description"></p>

    <h2 class="section-title" style="margin-top:40px;">
        Features
    </h2>

    <ul id="features-list" class="features"></ul>

</div>

<footer id="footer"></footer>

<script>
document.title = GAME_NAME;

document.getElementById("game-name").textContent = GAME_NAME;
document.getElementById("tagline").textContent = TAGLINE;
document.getElementById("description").textContent = DESCRIPTION;

document.getElementById("github-link").href = GITHUB_URL;
document.getElementById("itch-link").href = ITCH_URL;

document.getElementById("hero-image").src = HERO_IMAGE;

document.getElementById("footer").textContent =
    `© ${new Date().getFullYear()} ${AUTHOR}`;

const featureList = document.getElementById("features-list");

FEATURES.forEach(feature => {
    const li = document.createElement("li");
    li.textContent = "🎮 " + feature;
    featureList.appendChild(li);
});
</script>

</body>
</html>
